<!DOCTYPE html>
<html>

<head>
    <title>Employee Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
        }

        .header {
            background: #34495e;
            color: #fff;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(44, 62, 80, 0.08);
            padding: 32px 28px;
        }

        .section {
            margin-bottom: 32px;
        }

        .section h2 {
            margin-top: 0;
            color: #34495e;
        }

        .btn {
            background: #2980b9;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn:hover {
            background: #1c5d8c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #e1e4e8;
            text-align: left;
        }

        th {
            background: #f4f6fb;
            color: #34495e;
        }

        .success {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Employee Dashboard</h1>
        <button class="btn" onclick="logout()">Logout</button>
    </div>
    <div class="container">
        <div class="section">
            <h2 id="empNameHeader">Welcome, <span id="empName">Employee</span></h2>
        </div>
        <div class="section">
            <h2>Punch In/Out</h2>
            <button class="btn" onclick="punch('in')">Punch In</button>
            <button class="btn" onclick="punch('out')">Punch Out</button>
            <p id="punchMsg"></p>
        </div>
        <div class="section">
            <h2>Attendance History</h2>
            <table>
                <tr>
                    <th>Date</th>
                    <th>Punch In</th>
                    <th>Punch Out</th>
                    <th>Status</th>
                </tr>
                <tbody id="attendanceTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "empolyee.html";
        }
        function punch(type) {
            fetch("http://localhost:5000/api/user/punch", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + localStorage.getItem("token") },
                body: JSON.stringify({ type })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById("punchMsg").innerText = data.message || "Punch " + type + " recorded.";
                    document.getElementById("punchMsg").className = data.success ? "success" : "";
                    loadAttendance();
                });
        }
        function loadAttendance() {
            fetch("http://localhost:5000/api/user/attendance", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            })
                .then(res => res.json())
                .then(data => {
                    let rows = "";
                    data.forEach(a => {
                        const punchIn = a.loginTime ? new Date(a.loginTime).toLocaleTimeString() : '-';
                        const punchOut = a.logoutTime ? new Date(a.logoutTime).toLocaleTimeString() : '-';
                        rows += `<tr>
            <td>${a.date}</td>
            <td>${punchIn}</td>
            <td>${punchOut}</td>
            <td>${a.status}</td>
          </tr>`;
                    });
                    document.getElementById("attendanceTable").innerHTML = rows;
                });
        }
        function loadEmployeeName() {
            fetch("http://localhost:5000/api/user/me", {
                headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById("empName").innerText = data.name || "Employee";
                });
        }
        loadEmployeeName();
        loadAttendance();
    </script>
</body>

</html>
