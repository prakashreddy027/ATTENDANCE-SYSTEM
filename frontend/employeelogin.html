<!DOCTYPE html>
<html>

<head>
    <title>Employee Login</title>

    <style>
        body {
            font-family: Arial;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Employee Login</h2>

        <input id="email" placeholder="Email / Phone / UserID">

        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login with Password</button>

        <button onclick="sendOtp()">Login with OTP</button>

        <p id="msg"></p>

    </div>

    <script>

        async function login() {

            const email = document.getElementById("email").value
            const password = document.getElementById("password").value

            const res = await fetch("http://localhost:5000/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({ email, password })

            })

            const data = await res.json()

            if (res.status === 200) {

                localStorage.setItem("token", data.token)

                window.location.href = "employee.html"

            } else {

                document.getElementById("msg").innerText = data.message

            }

        }

        async function sendOtp() {

            const email = document.getElementById("email").value

            const res = await fetch("http://localhost:5000/api/user/send-otp", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({ email })

            })

            document.getElementById("msg").innerText = "OTP Sent"

        }

    </script>

</body>

</html>
